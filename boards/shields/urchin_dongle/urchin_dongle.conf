#include "../../../rgbled_adapter.conf"

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

# Enable zmk studio
CONFIG_ZMK_STUDIO=n

# Enable zmk log
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n

#Improve connection stability
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

#JJG:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

#for the 'upower' battery monitor with a different zmk repo
#CONFIG_ZMK_BATTERY_REPORTING_HID=y

CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_LV_Z_DOUBLE_VDB=n

CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=10
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=10
