# 화면 관련 설정. 실드 conf는 실드 목록 순서대로 병합되므로
# urchin_dongle 뒤에 나열하면 그쪽 값을 덮어쓴다.

CONFIG_DONGLE_SCREEN_EYES_ACTIVE=y
CONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=n
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=n
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=n
CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_DONGLE_SCREEN_FLIPPED=n

# urchin_dongle.conf가 MAX/DEFAULT를 10으로 고정하므로 여기서 올린다.
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=80

# 모듈은 FLUSH_THREAD=y + DOUBLE_VDB=y를 전제하는데 urchin_dongle.conf의
# RAM 절감용 DOUBLE_VDB=n이 버퍼를 하나로 만들어 모순이 생긴다.
# VDB를 50%에서 16%로 줄이면 이중 버퍼로도 RAM이 오히려 줄어든다.
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_LV_Z_DOUBLE_VDB=y

# 디스플레이/SPI 계층 상세 로그. 콘솔 연결은 build.yaml의 snippet이 담당한다.
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_MIPI_DBI_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_DBG=y
