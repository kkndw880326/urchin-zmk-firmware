# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# - board: seeeduino_xiao_ble
#   shield: urchin_dongle rgbled_adapter
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
#   artifact-name: urchin_dongle
# - board: nice_nano_v2
#   shield: urchin_left nice_view_adapter  nice_view_gem
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
# - board: nice_nano_v2
#   shield: urchin_right nice_view_adapter nice_view_gem
# - board: nice_nano_v2
#   shield: settings_reset
include:

    # Urchin
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: xiao_dongle

    # --- 진단용 3종 ---
    # 동글이 한 번도 부팅에 성공한 적이 없으므로, 화면이 아니라 동글 자체를 먼저 세운다.
    # 실드 목록은 셋 다 그대로 둔다(빼면 urchin_dongle.overlay의 &st7789 라벨이 없어 파싱 실패).

    # A: 디스플레이 계층만 통째로 제거
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_ZMK_DISPLAY=n -DCONFIG_DONGLE_SCREEN_EYES_ACTIVE=n -DCONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=n
    artifact-name: xiao_dongle_a_nodisplay

    # B: 드라이버/LVGL은 남기고 모듈의 커스텀 화면 코드만 제거
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
    artifact-name: xiao_dongle_b_stockscreen

    # C: A에 더해 의심 설정을 전부 되돌린 최소 구성.
    # 부팅 가능성이 가장 높은 조합이며, 이게 뜨면 여기서부터 하나씩 되돌려 범인을 찾는다.
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_ZMK_DISPLAY=n -DCONFIG_DONGLE_SCREEN_EYES_ACTIVE=n -DCONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=n -DCONFIG_BT_MAX_CONN=6 -DCONFIG_BT_MAX_PAIRED=6 -DCONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_POINTING=n -DCONFIG_ZMK_PM_SOFT_OFF=n
    artifact-name: xiao_dongle_c_minimal

  - board: nice_nano@2.0.0
    shield: urchin_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_left_peripheral
  - board: nice_nano@2.0.0
    shield: urchin_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_right

    # Reset shields
  - board: nice_nano@2.0.0
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
