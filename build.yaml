# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# - board: seeeduino_xiao_ble
#   shield: urchin_dongle rgbled_adapter
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
#   artifact-name: urchin_dongle
# - board: nice_nano_v2
#   shield: urchin_left nice_view_adapter  nice_view_gem
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
# - board: nice_nano_v2
#   shield: urchin_right nice_view_adapter nice_view_gem
# - board: nice_nano_v2
#   shield: settings_reset
include:

    # Urchin
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: xiao_dongle

    # --- 진단용 2종 ---
    # 동글이 한 번도 부팅에 성공한 적이 없으므로, 화면이 아니라 동글 자체를 먼저 세운다.
    # 디스플레이를 완전히 끄는 방식(-DCONFIG_ZMK_DISPLAY=n)은 모듈의
    # drivers/display/CMakeLists.txt가 가드되어 있지 않아 빌드가 깨진다. 그래서
    # 아래 둘은 디스플레이 계층을 남긴 채 각각 다른 축을 하나씩만 제거한다.

    # B: 모듈의 커스텀 화면 코드를 ZMK 기본 화면으로 교체.
    # STATUS_SCREEN은 Kconfig choice라 =n으로는 못 끄고, 다른 선택지를 =y로 줘야 한다.
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact-name: xiao_dongle_b_stockscreen

    # C: 화면은 그대로 두고 BLE/전원 쪽 의심 설정만 기본값으로 되돌린다.
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_BT_MAX_CONN=6 -DCONFIG_BT_MAX_PAIRED=6 -DCONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_POINTING=n -DCONFIG_ZMK_PM_SOFT_OFF=n
    artifact-name: xiao_dongle_c_stockble

  - board: nice_nano@2.0.0
    shield: urchin_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_left_peripheral
  - board: nice_nano@2.0.0
    shield: urchin_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_right

    # Reset shields
  - board: nice_nano@2.0.0
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
