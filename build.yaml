# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# - board: seeeduino_xiao_ble
#   shield: urchin_dongle rgbled_adapter
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
#   artifact-name: urchin_dongle
# - board: nice_nano_v2
#   shield: urchin_left nice_view_adapter  nice_view_gem
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
# - board: nice_nano_v2
#   shield: urchin_right nice_view_adapter nice_view_gem
# - board: nice_nano_v2
#   shield: settings_reset
include:

    # Urchin
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen urchin_screen_fix
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: xiao_dongle

    # --- 진단용 ---
    # 동글이 한 번도 부팅에 성공한 적이 없다. settings_reset 펌웨어는 USB로 정상
    # 인식되므로 보드/ZMK 기본은 이상이 없고, 원인은 동글 설정 안에 있다.
    # 아래 둘로 "화면 모듈"과 "동글 본체 설정"을 가른다.

    # D: 화면 모듈은 그대로 두고 위젯 코드만 제거.
    #    (DONGLE_SCREEN_*_ACTIVE는 일반 bool이라 오버라이드가 실제로 먹는다)
  - board: xiao_ble//zmk
    shield: urchin_dongle dongle_screen urchin_screen_fix
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_DONGLE_SCREEN_EYES_ACTIVE=n -DCONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=n
    artifact-name: xiao_dongle_d_nowidgets

    # E: 화면을 통째로 제거한 순수 동글. 이게 부팅되면 범인은 화면 모듈로 확정되고,
    #    무엇보다 로그가 읽히기 시작한다.
  - board: xiao_ble//zmk
    shield: urchin_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_ZMK_DISPLAY=n
    artifact-name: xiao_dongle_e_noscreen

  - board: nice_nano@2.0.0
    shield: urchin_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_left_peripheral
  - board: nice_nano@2.0.0
    shield: urchin_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_right

    # Reset shields
  - board: nice_nano@2.0.0
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
