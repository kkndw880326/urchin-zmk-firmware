# 화면 관련 설정은 boards/shields/urchin_screen_fix/urchin_screen_fix.conf 로 옮겼다.
#
# 단 CONFIG_ZMK_DISPLAY만 여기 남긴다. 병합 순서가
#   실드 conf들 → config/urchin_dongle.conf → config/urchin.conf → config/urchin_dongle.conf
# 이라서, config/urchin.conf의 CONFIG_ZMK_DISPLAY=n을 이길 수 있는 건 이 파일뿐이다.
# 화면 없는 빌드는 cmake-args(-DCONFIG_ZMK_DISPLAY=n)로 덮는다. cmake-args가 가장 마지막이다.
CONFIG_ZMK_DISPLAY=y
